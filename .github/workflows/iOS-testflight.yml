# SpendRecorder — the GitHub Actions workflow (copy of build/github-workflow.yml).
# Every build step lives in build/ios-build.sh, a normal visible file.

name: iOS build to TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "resources/**"
      - "build/**"
      - "package.json"
      - "capacitor.config.json"

concurrency:
  group: spendrecorder-ios-testflight
  cancel-in-progress: true

jobs:
  build:
    # macos-26 carries Xcode 26, which Capacitor 8 and the App Store require.
    # If GitHub ever rejects this label, change it to macos-15.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        # On failure, the last 40 lines of the log are shown as one annotation on the run
        # page, so the cause can be read without downloading the log.
        run: |
          set +e
          bash build/ios-build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 40 "$RUNNER_TEMP/build.log" | tr -d '\r' | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=Build failed (exit $status) — last 40 lines::$msg"
          fi
          exit "$status"
